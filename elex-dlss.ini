[DLSS]
; DLAA = native rendering. Quality = 66.7%, Balanced = 58%, Performance = 50%.
; Restart ELEX after changing mode. Keep in-game anti-aliasing on SMAA T2x.
Mode=Quality
; Model preset, independent of resolution mode: Default, E, F, J, K, L, M.
; E/F are deprecated legacy choices; NVIDIA/runtime overrides may take precedence.
Preset=Default
; Native NVIDIA HUD reports runtime preset and render/output sizes. Restart to apply.
; On/Off affect only ELEX. Driver leaves NVIDIA's existing indicator setting alone.
Indicator=On

[FrameGeneration]
; Native NVIDIA Dynamic Multi Frame Generation (RTX 50-series support required).
; Off keeps the original D3D11 presentation path. Restart after changing mode.
Mode=Dynamic
; Output FPS target. 0 follows the display refresh rate; no multiplier ceiling.
TargetFPS=122
; FG model presets are NVIDIA driver-profile settings. With ELEX closed, use
; tools/set-frame-generation.ps1 -Preset Default|A|B|C|Latest (see README).
